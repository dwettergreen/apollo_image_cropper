<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Apollo Terrain Review</title>
<style>
:root{--bg:#0e0f11;--panel:#17191c;--line:#2a2d32;--text:#e8e6e1;--muted:#9a9790;--accent:#d9b56b;--reject:#d8574a;--t1:#7fb38a;--t2:#d9b56b;--t3:#8a8f98}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:14px/1.4 -apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif}
header{position:sticky;top:0;z-index:5;background:rgba(14,15,17,.96);border-bottom:1px solid var(--line);padding:12px 16px}
h1{font-size:17px;margin:0 0 8px;font-weight:600;letter-spacing:.2px}
.row{display:flex;flex-wrap:wrap;gap:10px 18px;align-items:center}
label{color:var(--muted);font-size:13px}select,button{background:var(--panel);color:var(--text);border:1px solid var(--line);border-radius:6px;padding:5px 9px;font:inherit;font-size:13px}
button{cursor:pointer}button.primary{border-color:var(--accent);color:var(--accent)}
.stats{color:var(--muted);font-size:13px;margin-left:auto}
.help{color:var(--muted);font-size:12.5px;margin-top:6px}
main{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:12px;padding:14px 16px 60px}
.card{background:var(--panel);border:2px solid transparent;border-radius:8px;overflow:hidden;display:flex;flex-direction:column}
.card.rej{border-color:var(--reject)}.card.rej img{opacity:.35}
.imgwrap{position:relative;background:#000;aspect-ratio:1100/930;cursor:pointer}
.imgwrap img{width:100%;height:100%;object-fit:contain;display:block}
.badge{position:absolute;top:6px;left:6px;font-size:11px;font-weight:700;padding:1px 6px;border-radius:4px;background:#000c}
.T1{color:var(--t1)}.T2{color:var(--t2)}.T3{color:var(--t3)}
.rejtag{display:none;position:absolute;top:6px;right:6px;background:var(--reject);color:#fff;font-size:11px;font-weight:700;padding:1px 6px;border-radius:4px}
.card.rej .rejtag{display:block}
.meta{padding:7px 9px 9px;font-size:12.5px}.id{font-weight:600;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:12.5px}
.desc{color:var(--muted);margin-top:2px}.flags{color:var(--t2);margin-top:3px;font-size:11.5px}
.links{margin-top:5px;font-size:12px}.links a{color:var(--accent);text-decoration:none;margin-right:10px}
@media (max-width:600px){main{grid-template-columns:1fr 1fr;gap:8px;padding:10px}.meta{font-size:11.5px}}
</style></head><body>
<header>
<h1>Apollo surface frames: terrain-only review</h1>
<div class="row">
 <label>Tier <select id="tier"><option value="T1">Tier 1</option><option value="T2">Tier 2</option><option value="T3">Tier 3</option><option value="all">All candidates</option></select></label>
 <label>Mission <select id="mission"><option value="all">All</option><option>11</option><option>12</option><option>14</option><option>15</option><option>16</option><option>17</option></select></label>
 <label>Film <select id="film"><option value="all">Any</option><option value="color">Color</option><option value="bw">Black and white</option></select></label>
 <label>Lens <select id="lens"><option value="all">Any</option><option value="500">500 mm only</option></select></label>
 <label>Show <select id="show"><option value="all">All</option><option value="kept">Kept only</option><option value="rej">Rejected only</option></select></label>
 <span class="stats" id="stats"></span>
</div>
<div class="row" style="margin-top:8px">
 <button class="primary" id="keep">Download keep list</button>
 <button id="rejl">Download reject list</button>
 <button id="clear">Clear all rejections</button>
</div>
<div class="help">Click an image to reject it (click again to undo). Rejections are saved in this browser. "Download keep list" saves the frames you have not rejected under the current filters, for use with: python3 download_apollo.py --ids keep_list.txt --crop</div>
</header>
<main id="grid"></main>

const KEY='apollo-terrain-rejects-v1';
let rej=new Set();
try{rej=new Set(JSON.parse(localStorage.getItem(KEY)||'[]'))}catch(e){}
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify([...rej]))}catch(e){}};
const $=id=>document.getElementById(id);
const grid=$('grid');
const cards=DATA.map(d=>{
 const c=document.createElement('div');c.className='card';c.dataset.id=d.id;
 const flags=d.s?`<div class="flags">${d.s}</div>`:'';
 c.innerHTML=`<div class="imgwrap"><img loading="lazy" alt="" src="${d.u}"><span class="badge ${d.t}">${d.t.replace('T','Tier ')}</span><span class="rejtag">Rejected</span></div>
 <div class="meta"><div class="id">${d.id}</div><div class="desc">${d.d||'No NASA catalog description'}${d.L?` · ${d.L} mm`:''} · ${d.f==='bw'?'B&amp;W':'color'}</div>${flags}
 <div class="links"><a href="${d.u}" target="_blank" rel="noopener">Larger image</a>${d.p?`<a href="${d.p}" target="_blank" rel="noopener">LPI page</a>`:''}</div></div>`;
 c.querySelector('.imgwrap').addEventListener('click',()=>{rej.has(d.id)?rej.delete(d.id):rej.add(d.id);c.classList.toggle('rej',rej.has(d.id));save();stats()});
 if(rej.has(d.id))c.classList.add('rej');
 return [d,c]});
function visible(){const t=$('tier').value,m=$('mission').value,f=$('film').value,l=$('lens').value,s=$('show').value;
 return cards.filter(([d])=>(t==='all'||d.t===t)&&(m==='all'||String(d.m)===m)&&(f==='all'||d.f===f)&&(l==='all'||d.L===500)&&(s==='all'||(s==='kept'?!rej.has(d.id):rej.has(d.id))))}
function render(){const v=visible();grid.replaceChildren(...v.map(x=>x[1]));stats()}
function stats(){const v=visible();const r=v.filter(([d])=>rej.has(d.id)).length;$('stats').textContent=`${v.length} shown · ${v.length-r} kept · ${r} rejected (${rej.size} rejected overall)`}
function dl(name,ids){const b=new Blob([ids.join('\n')+'\n'],{type:'text/plain'});const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download=name;document.body.appendChild(a);a.click();a.remove()}
$('keep').onclick=()=>dl('keep_list.txt',visible().filter(([d])=>!rej.has(d.id)).map(([d])=>d.id));
$('rejl').onclick=()=>dl('reject_list.txt',[...rej]);
$('clear').onclick=()=>{if(confirm('Clear all rejections?')){rej.clear();save();cards.forEach(([,c])=>c.classList.remove('rej'));stats()}};
['tier','mission','film','lens','show'].forEach(id=>$(id).addEventListener('change',render));
render();
</script></body></html>
